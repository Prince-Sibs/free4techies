name: Submerge to Main

on:
  push:
    branches: [main]
    paths:
      - "contribution/resources.json"

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/merge.js contribution/resources.json public/resources.json

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/resources.json
          # reset contribution file so next person doesn't conflict
          echo '{}' > contribution/resources.json
          git add contribution/resources.json
          git diff --staged --quiet || (git commit -m "submerge resources to main" && git push)
